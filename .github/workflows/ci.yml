name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@8bc15f4abe312f58b2f55ef9148c16bc19619a49
      - name: Install workspace dependencies
        run: nix develop --command bun install --frozen-lockfile
      - name: Check Go package
        run: nix develop --command vp run check
      - name: Test Go package
        run: nix develop --command vp run test
      - name: Build Go package
        run: nix develop --command vp run build
      - name: Build Nix package
        run: nix build --no-link
